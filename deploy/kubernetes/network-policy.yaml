apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nyrathen-game, namespace: nyrathen}
spec:
  podSelector: {matchLabels: {app: nyrathen-game}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {nyrathen-ingress: "true"}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: nyrathen-state}}
      ports: [{protocol: TCP, port: 3400}]
    - to: []
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: nyrathen-state, namespace: nyrathen}
spec:
  podSelector: {matchLabels: {app: nyrathen-state}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: nyrathen-game}}
      ports: [{protocol: TCP, port: 3400}]
  egress:
    - to: []
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 443}
