apiVersion: v1
kind: Service
metadata: {name: nyrathen-game, namespace: nyrathen}
spec:
  selector: {app: nyrathen-game}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: nyrathen-game, namespace: nyrathen}
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app: nyrathen-game}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: nyrathen-game, namespace: nyrathen}
spec:
  minReplicas: 14
  maxReplicas: 126
  scaleTargetRef: {apiVersion: apps/v1, kind: StatefulSet, name: nyrathen-game}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 55}
