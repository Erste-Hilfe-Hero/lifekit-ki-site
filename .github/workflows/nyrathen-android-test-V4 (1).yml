name: Nyrathen Android Test ONLY

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyrathen-android-test-only
  cancel-in-progress: true

jobs:
  android-test:
    name: Android API 36 Build + Emulator Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Nyrathen
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator"

          test -f "$SDK/platforms/android-36/android.jar"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/emulator/emulator"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available:"
            ls -l /dev/kvm
          else
            echo "KVM unavailable; emulator may use software acceleration."
          fi

      - name: Verify and harden Android project
        shell: bash
        run: |
          set -euo pipefail

          node -e "const p=require('./package.json'); if(p.name!=='nyrathen') process.exit(1)"

          test -f native/android/app/build.gradle
          test -f native/android/gradle.properties
          test -f native/android/app/src/main/AndroidManifest.xml
          test -f native/android/app/src/main/java/game/nyrathen/mobile/MainActivity.java
          test -f native/android/app/src/main/java/game/nyrathen/mobile/StoreBridge.java
          test -f native/android/gradlew

          grep -q "compileSdk 36" native/android/app/build.gradle
          grep -q "targetSdk 36" native/android/app/build.gradle
          grep -q "minSdk 26" native/android/app/build.gradle
          grep -q "applicationId 'game.nyrathen.mobile'" native/android/app/build.gradle
          grep -q "billing:9.1.0" native/android/app/build.gradle

          # Billing 9.x depends on AndroidX. Fail-safe repair for older uploaded repo state.
          if grep -q '^android.useAndroidX=false' native/android/gradle.properties; then
            sed -i 's/^android\.useAndroidX=false/android.useAndroidX=true/' native/android/gradle.properties
          fi

          grep -q '^android.useAndroidX=true' native/android/gradle.properties

          echo "----- gradle.properties -----"
          cat native/android/gradle.properties
          echo "----- app build.gradle essentials -----"
          grep -E "compileSdk|targetSdk|minSdk|applicationId|billing:" native/android/app/build.gradle

      - name: Harmonize Kotlin runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("native/android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          marker = "plugins { id 'com.android.application' }\n"
          block = '''
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
    }
}
'''

          if "kotlin-stdlib-jdk8" not in s:
              if marker not in s:
                  raise SystemExit("Android application plugin marker not found")
              s = s.replace(marker, marker + "\n" + block + "\n", 1)
              p.write_text(s, encoding="utf-8")

          print("Kotlin runtime harmonization present")
          PY

          grep -q "kotlin-stdlib-jdk7" native/android/app/build.gradle
          grep -q "kotlin-stdlib-jdk8" native/android/app/build.gradle
          grep -q "kotlin-stdlib:1.8.22" native/android/app/build.gradle

      - name: Restore release workflow fixtures locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          if [ -d ci/workflows-pending ]; then
            cp -f ci/workflows-pending/*.yml .github/workflows/ 2>/dev/null || true
          fi
          test -f .github/workflows/mobile-beta.yml
          test -f .github/workflows/mobile-store-release.yml
          test -f .github/workflows/ios-simulator-ci.yml

      - name: Full regression
        run: npm test

      - name: Gradle dependency preflight
        shell: bash
        working-directory: native/android
        run: |
          set -euo pipefail

          sh gradlew :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon > ../../release-android-dependencies.txt

          grep -q "com.android.billingclient:billing:9.1.0" ../../release-android-dependencies.txt
          grep -q "androidx.core:core" ../../release-android-dependencies.txt
          grep -q "org.jetbrains.kotlin:kotlin-stdlib:1.8.22" ../../release-android-dependencies.txt

          # Prove the legacy artifacts are excluded from the resolved graph.
          if grep -E "org\.jetbrains\.kotlin:kotlin-stdlib-jdk(7|8):" ../../release-android-dependencies.txt; then
            echo "Legacy Kotlin jdk7/jdk8 stdlib artifacts still present." >&2
            exit 4
          fi

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail

          node tools/build-mobile.mjs android-debug

          APK="native/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p release/android-ci/latest
          cp "$APK" release/android-ci/Nyrathen-Android-Debug.apk

          sha256sum release/android-ci/Nyrathen-Android-Debug.apk \
            | tee release/android-ci/Nyrathen-Android-Debug.apk.sha256

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail

          APK="release/android-ci/Nyrathen-Android-Debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"

          "$AAPT" dump badging "$APK" > release/android-ci/latest/aapt-badging.txt

          grep -q "package: name='game.nyrathen.mobile.dev'" release/android-ci/latest/aapt-badging.txt
          grep -q "versionCode='57'" release/android-ci/latest/aapt-badging.txt
          grep -q "versionName='5.7.0-dev'" release/android-ci/latest/aapt-badging.txt
          grep -q "sdkVersion:'26'" release/android-ci/latest/aapt-badging.txt
          grep -q "targetSdkVersion:'36'" release/android-ci/latest/aapt-badging.txt

          {
            echo "sha256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "size_bytes=$(wc -c < "$APK" | tr -d ' ')"
            echo "package=game.nyrathen.mobile.dev"
            echo "version=5.7.0-dev"
            echo "version_code=57"
            echo "min_sdk=26"
            echo "target_sdk=36"
          } | tee release/android-ci/latest/apk-metadata.txt

      - name: Android API 36 emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot
            -camera-back none
            -camera-front none
          script: |
            set -euo pipefail

            OUT="release/android-ci/latest"
            APK="release/android-ci/Nyrathen-Android-Debug.apk"
            PACKAGE="game.nyrathen.mobile.dev"

            mkdir -p "$OUT"

            adb wait-for-device

            for i in $(seq 1 120); do
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$BOOT" = "1" ]; then
                break
              fi
              sleep 2
            done

            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            adb shell input keyevent 82 || true
            adb shell wm dismiss-keyguard || true

            adb shell getprop ro.build.version.release | tr -d '\r' > "$OUT/android-version.txt"
            adb shell getprop ro.build.version.sdk | tr -d '\r' > "$OUT/android-api.txt"
            adb shell getprop ro.product.model | tr -d '\r' > "$OUT/device-model.txt"

            test "$(cat "$OUT/android-api.txt")" = "36"

            adb logcat -c
            adb install -r "$APK" | tee "$OUT/install.txt"

            adb shell pm path "$PACKAGE" | tee "$OUT/package-path.txt"
            grep -q '^package:' "$OUT/package-path.txt"

            COMPONENT="$(adb shell cmd package resolve-activity --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "$PACKAGE" | tr -d '\r' | tail -n 1)"

            test -n "$COMPONENT"
            test "$COMPONENT" != "No activity found"
            echo "$COMPONENT" | tee "$OUT/launcher-component.txt"

            adb shell am force-stop "$PACKAGE" || true
            adb shell am start -W -n "$COMPONENT" | tee "$OUT/launch.txt"

            sleep 20

            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' | awk '{print $1}')"
            if [ -z "$PID" ]; then
              adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
              adb shell dumpsys activity activities > "$OUT/activities.txt" || true
              echo "Nyrathen process is not alive after smoke window." >&2
              exit 6
            fi

            echo "$PID" | tee "$OUT/pid.txt"

            adb shell dumpsys activity activities > "$OUT/activities.txt"
            adb shell dumpsys window windows > "$OUT/windows.txt"
            adb shell dumpsys package "$PACKAGE" > "$OUT/package.txt"
            adb exec-out screencap -p > "$OUT/nyrathen-android-emulator.png"
            adb logcat -d -v threadtime > "$OUT/logcat.txt"

            grep -Fq "$PACKAGE" "$OUT/activities.txt"

            if grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: ${PACKAGE}.*has died" "$OUT/logcat.txt"; then
              echo "Fatal Android runtime evidence detected." >&2
              exit 7
            fi

            cat > "$OUT/result.json" <<JSON
            {
              "status": "passed",
              "kind": "android-api36-emulator-smoke",
              "package": "$PACKAGE",
              "pid": "$PID",
              "version": "5.7.0-dev",
              "buildNumber": 57,
              "apiLevel": 36,
              "signedReleaseAab": false,
              "physicalDeviceTestPerformed": false,
              "googlePlayUploadPerformed": false
            }
            JSON

            cat "$OUT/result.json"

      - name: Collect Android diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p release/android-ci/latest
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "android_home=${ANDROID_HOME:-}"
            echo "android_sdk_root=${ANDROID_SDK_ROOT:-}"
          } > release/android-ci/latest/ci-environment.txt

          cp release-android-dependencies.txt release/android-ci/latest/dependencies.txt 2>/dev/null || true

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyrathen-android-test-evidence
          path: |
            release/android-ci/
          if-no-files-found: warn
          retention-days: 14
