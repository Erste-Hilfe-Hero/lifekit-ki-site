name: Nyrathen Bootstrap + iOS Simulator

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyrathen-bootstrap-ios
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Prepare Nyrathen repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      new_head: ${{ steps.prepare.outputs.new_head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect existing Nyrathen or migrate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          # Nyrathen was already installed by an earlier successful bootstrap.
          if node -e "const p=require('./package.json'); process.exit(p.name==='nyrathen' ? 0 : 1)" 2>/dev/null \
             && [ -d "native/ios" ] \
             && [ -f "tools/ios-simulator-smoke.sh" ]; then
            echo "Nyrathen is already present. Skipping one-time migration."
            echo "mode=already-migrated" >> "$GITHUB_OUTPUT"
            echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARCHIVE="$RUNNER_TEMP/nyrathen_repo_payload.tar.xz"

          if [ -f "nyrathen_repo_payload.tar.xz" ]; then
            cp nyrathen_repo_payload.tar.xz "$ARCHIVE"
          else
            # Recover the one-time payload from Git history if it was already removed from main.
            PAYLOAD_COMMIT="$(git log --all --format=%H -- nyrathen_repo_payload.tar.xz | head -n 1 || true)"
            if [ -n "$PAYLOAD_COMMIT" ]; then
              echo "Recovering Nyrathen payload from Git history: $PAYLOAD_COMMIT"
              git show "$PAYLOAD_COMMIT:nyrathen_repo_payload.tar.xz" > "$ARCHIVE"
            elif [ -f "nyrathen_repo_payload.png" ]; then
              python3 -m pip install --quiet pillow
              python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, struct

          img = Image.open("nyrathen_repo_payload.png").convert("RGB")
          raw = img.tobytes()
          if raw[:8] != b"NYRPKG1\0":
              raise SystemExit("invalid Nyrathen PNG payload header")
          size = struct.unpack(">Q", raw[8:16])[0]
          expected = raw[16:48]
          payload = raw[48:48+size]
          if len(payload) != size:
              raise SystemExit("truncated Nyrathen PNG payload")
          if hashlib.sha256(payload).digest() != expected:
              raise SystemExit("Nyrathen PNG payload SHA-256 mismatch")
          Path("/tmp/nyrathen_repo_payload.tar.xz").write_bytes(payload)
          PY
              cp /tmp/nyrathen_repo_payload.tar.xz "$ARCHIVE"
            else
              echo "No Nyrathen payload found in working tree or Git history."
              exit 1
            fi
          fi

          TMP="$(mktemp -d)"
          tar -xJf "$ARCHIVE" -C "$TMP"

          test -f "$TMP/package.json"
          test -d "$TMP/native/ios"
          test -f "$TMP/tools/ios-simulator-smoke.sh"

          BACKUP_BRANCH="backup/pre-nyrathen-${GITHUB_RUN_ID}"
          git branch "$BACKUP_BRANCH" HEAD
          git push origin "$BACKUP_BRANCH"

          KEEP_WORKFLOW="$RUNNER_TEMP/nyrathen-bootstrap-ios.yml"
          cp ".github/workflows/nyrathen-bootstrap-ios.yml" "$KEEP_WORKFLOW"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a "$TMP"/ ./

          mkdir -p .github/workflows
          cp "$KEEP_WORKFLOW" ".github/workflows/nyrathen-bootstrap-ios.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Nyrathen v5.7 iOS CI Ready"
          git push origin HEAD:main

          echo "mode=migrated-now" >> "$GITHUB_OUTPUT"
          echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ios-simulator:
    name: Xcode build + iPhone simulator smoke
    needs: bootstrap
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout Nyrathen main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "${MAJOR:-0}" -ge 26

      - name: Verify Nyrathen source
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.name!=='nyrathen') process.exit(1)"
          test -d native/ios
          test -f tools/ios-simulator-smoke.sh

      - name: Full regression
        run: npm test

      - name: Mobile UI checks
        run: npm run test:ui

      - name: Build unsigned iOS simulator app
        run: npm run build:ios

      - name: Boot simulator, install and launch Nyrathen
        run: bash tools/ios-simulator-smoke.sh

      - name: Package simulator app
        if: always()
        shell: bash
        run: |
          mkdir -p release/ios-ci
          APP="native/ios/build/Build/Products/Debug-iphonesimulator/Nyrathen.app"
          if [ -d "$APP" ]; then
            ditto -c -k --keepParent "$APP" release/ios-ci/Nyrathen-Simulator.zip
            shasum -a 256 release/ios-ci/Nyrathen-Simulator.zip \
              > release/ios-ci/Nyrathen-Simulator.zip.sha256
          fi

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyrathen-ios-simulator-evidence
          path: |
            release/ios-ci/latest/
            release/ios-ci/Nyrathen-Simulator.zip
            release/ios-ci/Nyrathen-Simulator.zip.sha256
          if-no-files-found: warn
          retention-days: 14
