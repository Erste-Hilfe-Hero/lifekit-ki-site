name: Nyrathen Bootstrap + iOS Simulator

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyrathen-bootstrap-ios
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Replace LifeKit with Nyrathen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backup_branch: ${{ steps.replace.outputs.backup_branch }}
      new_head: ${{ steps.replace.outputs.new_head }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify payload and replace repository
        id: replace
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD="nyrathen_repo_payload.tar.xz"
          EXPECTED_SHA="517b3afe979d698779bdd83b92c86166152b3af2128cd124e0d1058a5bad4c9b"
          BOOTSTRAP=".github/workflows/nyrathen-bootstrap-ios.yml"

          if [ ! -f "$PAYLOAD" ]; then
            echo "No bootstrap payload found; repository replacement already completed."
            echo "backup_branch=already-replaced" >> "$GITHUB_OUTPUT"
            echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$EXPECTED_SHA  $PAYLOAD" | sha256sum -c -

          OLD_SHA="$(
            git rev-list HEAD | while read -r sha; do
              if ! git cat-file -e "$sha:$PAYLOAD" 2>/dev/null &&
                 ! git cat-file -e "$sha:$BOOTSTRAP" 2>/dev/null; then
                echo "$sha"
                break
              fi
            done
          )"

          test -n "$OLD_SHA"

          BACKUP_BRANCH="backup/lifekit-before-nyrathen-${GITHUB_RUN_ID}"
          git branch "$BACKUP_BRANCH" "$OLD_SHA"
          git push origin "$BACKUP_BRANCH"

          TMP="$(mktemp -d)"
          tar -xJf "$PAYLOAD" -C "$TMP"

          test -f "$TMP/package.json"
          test -d "$TMP/native/ios"
          test -f "$TMP/tools/ios-simulator-smoke.sh"

          cp "$BOOTSTRAP" "$RUNNER_TEMP/nyrathen-bootstrap-ios.yml"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a "$TMP"/ ./

          if [ -d ".github/workflows" ]; then
            mkdir -p ci/workflows-pending
            cp -a .github/workflows/. ci/workflows-pending/
          fi

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/nyrathen-bootstrap-ios.yml" "$BOOTSTRAP"

          rm -f "$PAYLOAD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace LifeKit with Nyrathen v5.7 iOS CI Ready"
          git push origin HEAD:main

          NEW_HEAD="$(git rev-parse HEAD)"
          echo "backup_branch=$BACKUP_BRANCH" >> "$GITHUB_OUTPUT"
          echo "new_head=$NEW_HEAD" >> "$GITHUB_OUTPUT"

      - name: Replacement summary
        shell: bash
        run: |
          echo "Backup branch: ${{ steps.replace.outputs.backup_branch }}"
          echo "Nyrathen commit: ${{ steps.replace.outputs.new_head }}"

  ios-simulator:
    name: Xcode build + iPhone simulator smoke
    needs: bootstrap
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout new Nyrathen main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: false

      - name: Verify Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "${MAJOR:-0}" -ge 26

      - name: Full regression
        run: npm test

      - name: Mobile UI checks
        run: npm run test:ui

      - name: Build unsigned iOS simulator app
        run: npm run build:ios

      - name: Boot simulator, install and launch Nyrathen
        run: bash tools/ios-simulator-smoke.sh

      - name: Package simulator app
        if: always()
        shell: bash
        run: |
          mkdir -p release/ios-ci
          if [ -d native/ios/build/Build/Products/Debug-iphonesimulator/Nyrathen.app ]; then
            ditto -c -k --keepParent               native/ios/build/Build/Products/Debug-iphonesimulator/Nyrathen.app               release/ios-ci/Nyrathen-Simulator.zip
            shasum -a 256 release/ios-ci/Nyrathen-Simulator.zip               > release/ios-ci/Nyrathen-Simulator.zip.sha256
          fi

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyrathen-ios-simulator-evidence
          path: |
            release/ios-ci/latest/
            release/ios-ci/Nyrathen-Simulator.zip
            release/ios-ci/Nyrathen-Simulator.zip.sha256
          if-no-files-found: warn
          retention-days: 14
